name: M-Skill gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  mskill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install M-Skill
        run: python -m pip install "git+https://github.com/luozhou0001-bot/m-skill.git@v0.4.0"
      - name: Enforce M-Skill gate
        run: mskill check --format github
