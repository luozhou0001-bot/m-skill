[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m-skill"
version = "0.1.0"
description = "A red-team-gated workflow CLI for rigorous AI-assisted modeling projects."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "luozhou0001-bot"}]
keywords = ["ai", "workflow", "red-team", "mathematical-modeling", "codex"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
mskill = "mskill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
